<!DOCTYPE html>
<html>

<head>
    <title>FastAPI CORS Test</title>
</head>

<body>
    <h1>FastAPI CORS Testing</h1>

    <button onclick="testCORS()">Test Backend Connection</button>

    <pre id="result">Click the button to test...</pre>

    <script>
        async function testCORS() {
            const result = document.getElementById("result");

            try {
                const response = await fetch("http://127.0.0.1:8000/");

                const data = await response.json();

                result.textContent =
                    "SUCCESS! CORS is working.\n\n" +
                    JSON.stringify(data, null, 2);
            } catch (error) {
                result.textContent =
                    "ERROR: " + error.message;
                console.error(error);
            }
        }
    </script>
</body>

</html>
